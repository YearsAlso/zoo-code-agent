name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.11 是 requires-python 的下界（0.12.0 起框架降到 3.11）：下界 MUST 在 CI 里真跑，
        # 否则"声明支持 3.11"只是文档承诺。
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 默认 extras —— 刻意**不含** anthropic：全链路 MUST 能在没有任何模型密钥的
      # 环境里跑通，这是脚本化实现作为一等公民的意义所在。
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # A2 / spec「真实提供方 MUST 为可选依赖」在 CI 侧的执行：默认安装 MUST NOT 引入
      # 提供方 SDK。它同时把 tests/test_providers.py 里那条「缺依赖」用例从 skip 变成真跑
      # （该用例在 anthropic 已安装时会 skip，skip 是静默的）。
      # shell: bash 与纯 ASCII 输出都是必需的：windows runner 默认 shell 是 pwsh、控制台
      # 编码是 cp1252，非 ASCII 会让本步**假失败**（实测过）。
      - name: Assert provider SDK is absent
        shell: bash
        run: |
          python -c "import importlib.util, sys; sys.exit(1) if importlib.util.find_spec('anthropic') else print('OK: anthropic absent from default install')"

      # 不设任何 ANTHROPIC_* 环境变量：有密钥反而会让「无密钥可跑」这条保证失去意义。
      - name: Test
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  extras:
    # 装了可选 extras 之后的**同一批用例**必须照样全绿：渲染契约是 ops、全屏界面的契约是
    # "状态归约 + 投影"、提供方路径的契约是"真 SDK + 本地假服务"——都不是某个具体库。
    #
    # **为什么要装 anthropic**：默认安装刻意不含提供方 SDK（上面那两个作业的"断言 SDK 缺席"
    # 就是这条保证）。但这样一来"真 SDK 的 HTTP 路径"那组用例会在别处静默跳过——
    # 于是这里装上它，让那些用例**真的跑一次**。
    name: optional extras / py3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install with the optional extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tui,rich,anthropic]"
      - name: Assert the optional extras really are present
        run: |
          python -c "import anthropic, rich, textual; print('OK: rich', rich.__version__, '/ textual', textual.__version__, '/ anthropic', anthropic.__version__)"
      - name: Test
        run: pytest
